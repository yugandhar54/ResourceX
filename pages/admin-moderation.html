<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Content Moderation – ResourceX Admin</title>
  <meta name="description" content="Review pending resource listings, inspect reported campus content, and manage academic integrity compliance."/>
  <link rel="stylesheet" href="../css/variables.css"/>
  <link rel="stylesheet" href="../css/global.css"/>
  <link rel="stylesheet" href="../css/layout.css"/>
  <link rel="stylesheet" href="../css/components.css"/>
  <link rel="stylesheet" href="../css/dashboard.css"/>
</head>
<body>
<div class="page-wrapper">
  <div class="dashboard-layout">
    <aside class="dashboard-sidebar" id="dashboard-sidebar" aria-label="Dashboard navigation"></aside>

    <main class="dashboard-content">
      <div class="dashboard-content-header" style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:var(--space-4)">
        <div>
          <div style="display:flex;align-items:center;gap:var(--space-2);margin-bottom:var(--space-1)">
            <h1>Resource Moderation Queue</h1>
            <span class="badge badge-warning">MODERATION</span>
          </div>
          <p class="text-secondary">Approve newly submitted physical and digital resources, review policy reports, and protect campus academic integrity.</p>
        </div>
      </div>

      <!-- Tabs -->
      <div class="tabs" style="margin-bottom:var(--space-6)">
        <button class="tab-btn active" id="tab-mod-pending" onclick="switchModTab('pending')">Pending Listings (<span id="mod-count-pending">0</span>)</button>
        <button class="tab-btn" id="tab-mod-reported" onclick="switchModTab('reported')">Reported Content (<span id="mod-count-reported">0</span>)</button>
        <button class="tab-btn" id="tab-mod-resolved" onclick="switchModTab('resolved')">Audit History</button>
      </div>

      <!-- Moderation Items Container -->
      <div id="mod-items-container" style="display:flex;flex-direction:column;gap:var(--space-4)">
        <!-- Populated via JS -->
      </div>
    </main>
  </div>
</div>

<script src="../js/config.js"></script>
<script src="../js/demo-data.js"></script>
<script src="../js/api.js"></script>
<script src="../js/common.js"></script>
<script src="../js/admin.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    initAdminModeration();
  });
</script>
</body>
</html>
