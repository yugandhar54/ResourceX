<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Browse Resources – ResourceX</title>
  <meta name="description" content="Browse and discover academic resources available on campus — books, electronics, notes, lab equipment, and more."/>
  <link rel="stylesheet" href="../css/variables.css"/>
  <link rel="stylesheet" href="../css/global.css"/>
  <link rel="stylesheet" href="../css/layout.css"/>
  <link rel="stylesheet" href="../css/components.css"/>
  <link rel="stylesheet" href="../css/marketplace.css"/>
</head>
<body>
<div class="page-wrapper">
  <main class="main-content">
    <!-- Page Header -->
    <div class="page-header">
      <div class="container">
        <nav class="breadcrumb" aria-label="Breadcrumb"><a href="../index.html">Home</a><span>/</span><span aria-current="page">Browse Resources</span></nav>
        <h1>Browse Resources</h1>
        <p>Explore academic resources shared by your campus community.</p>
      </div>
    </div>

    <div class="container">
      <!-- Mobile filter trigger -->
      <div style="display:flex;align-items:center;justify-content:space-between;padding:var(--space-4) 0">
        <button class="btn btn-outline btn-sm filter-drawer-trigger" id="filter-trigger" aria-expanded="false" aria-controls="filter-drawer">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="6" x2="20" y2="6"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="11" y1="18" x2="13" y2="18"/></svg>
          Filters
        </button>
        <div id="active-filters-bar" class="browse-active-filters" style="flex:1;margin-left:var(--space-4)"></div>
      </div>

      <div class="browse-layout">
        <!-- Sidebar Filters -->
        <aside class="browse-sidebar" aria-label="Resource filters">
          <div class="filter-panel" id="filter-panel">
            <div class="filter-panel-header">
              <h3>Filters</h3>
              <button class="btn btn-ghost btn-sm" id="clear-filters-btn" onclick="clearAllFilters()">Clear all</button>
            </div>

            <div class="filter-group">
              <div class="filter-group-title">Resource Type</div>
              <div class="filter-options">
                <label class="filter-check"><input type="radio" name="type" value="all" checked onchange="applyFilters()"> All Types</label>
                <label class="filter-check"><input type="radio" name="type" value="physical" onchange="applyFilters()"> Physical</label>
                <label class="filter-check"><input type="radio" name="type" value="digital"  onchange="applyFilters()"> Digital</label>
              </div>
            </div>

            <div class="filter-group">
              <div class="filter-group-title">Exchange Mode</div>
              <div class="filter-options">
                <label class="filter-check"><input type="checkbox" value="free"   onchange="applyFilters()"> Free Sharing</label>
                <label class="filter-check"><input type="checkbox" value="borrow" onchange="applyFilters()"> Borrow / Lend</label>
                <label class="filter-check"><input type="checkbox" value="sell"   onchange="applyFilters()"> Buy / Sell</label>
              </div>
            </div>

            <div class="filter-group">
              <div class="filter-group-title">Category</div>
              <div class="filter-options" id="category-filter">
                <label class="filter-check"><input type="radio" name="category" value="all" checked onchange="applyFilters()"> All Categories</label>
                <label class="filter-check"><input type="radio" name="category" value="books"       onchange="applyFilters()"> Books &amp; Textbooks</label>
                <label class="filter-check"><input type="radio" name="category" value="electronics" onchange="applyFilters()"> Electronics &amp; IoT</label>
                <label class="filter-check"><input type="radio" name="category" value="lab"         onchange="applyFilters()"> Lab Equipment</label>
                <label class="filter-check"><input type="radio" name="category" value="materials"   onchange="applyFilters()"> Project Materials</label>
                <label class="filter-check"><input type="radio" name="category" value="notes"       onchange="applyFilters()"> Notes &amp; PDFs</label>
                <label class="filter-check"><input type="radio" name="category" value="papers"      onchange="applyFilters()"> Question Papers</label>
                <label class="filter-check"><input type="radio" name="category" value="slides"      onchange="applyFilters()"> Presentations</label>
                <label class="filter-check"><input type="radio" name="category" value="manuals"     onchange="applyFilters()"> Lab Manuals</label>
              </div>
            </div>

            <div class="filter-group">
              <div class="filter-group-title">Availability</div>
              <div class="filter-options">
                <label class="filter-check"><input type="radio" name="avail" value="all"       checked onchange="applyFilters()"> All</label>
                <label class="filter-check"><input type="radio" name="avail" value="available" onchange="applyFilters()"> Available</label>
              </div>
            </div>

            <div class="filter-group">
              <div class="filter-group-title">Price Range</div>
              <div class="price-range">
                <div class="price-inputs">
                  <input type="number" id="min-price" class="form-control" placeholder="₹ Min" min="0" onchange="applyFilters()"/>
                  <span>–</span>
                  <input type="number" id="max-price" class="form-control" placeholder="₹ Max" min="0" onchange="applyFilters()"/>
                </div>
              </div>
            </div>
          </div>
        </aside>

        <!-- Main Content -->
        <div class="browse-main">
          <!-- Search + Sort Toolbar -->
          <div class="browse-search-bar">
            <div class="search-bar" role="search">
              <input type="search" id="browse-search" placeholder="Search resources by title, subject, tags…" aria-label="Search resources" oninput="debounceSearch()"/>
              <button class="btn btn-primary" onclick="applyFilters()">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                Search
              </button>
            </div>
          </div>

          <div class="browse-toolbar">
            <div class="browse-result-info" id="result-info" aria-live="polite">Loading resources…</div>
            <div class="browse-sort">
              <label for="sort-select">Sort by:</label>
              <select class="form-control" id="sort-select" style="width:auto" onchange="applyFilters()">
                <option value="relevance">Most Relevant</option>
                <option value="newest">Newest First</option>
                <option value="oldest">Oldest First</option>
                <option value="price_asc">Price: Low to High</option>
                <option value="price_desc">Price: High to Low</option>
                <option value="rating">Highest Rated</option>
              </select>
              <div class="browse-view-toggle">
                <button class="view-btn active" id="grid-view-btn" onclick="setView('grid')" aria-label="Grid view" aria-pressed="true">
                  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
                </button>
                <button class="view-btn" id="list-view-btn" onclick="setView('list')" aria-label="List view" aria-pressed="false">
                  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
                </button>
              </div>
            </div>
          </div>

          <!-- Resources Grid -->
          <div class="resource-grid" id="resources-grid"><!-- Loaded by JS --></div>

          <!-- Pagination -->
          <div id="pagination-container" style="margin-top:var(--space-8)"></div>
        </div>
      </div>
    </div>

    <!-- Mobile Filter Drawer -->
    <div class="filter-drawer" id="filter-drawer" aria-label="Filter drawer" role="dialog" aria-modal="true">
      <div class="filter-drawer-header">
        <h3>Filters</h3>
        <button class="btn btn-ghost btn-sm" id="close-drawer" aria-label="Close filters">✕ Close</button>
      </div>
      <!-- Mirror of sidebar filters for mobile -->
      <div style="padding:var(--space-4)">
        <p class="text-muted text-sm" style="margin-bottom:var(--space-4)">Use the filters in the sidebar on desktop. On mobile, use the sort controls above.</p>
        <button class="btn btn-primary" style="width:100%" onclick="closeFilterDrawer()">Apply & Close</button>
      </div>
    </div>
    <div class="filter-drawer-backdrop" id="filter-backdrop" onclick="closeFilterDrawer()"></div>
  </main>
</div>

<script src="../js/config.js"></script>
<script src="../js/demo-data.js"></script>
<script src="../js/api.js"></script>
<script src="../js/common.js"></script>
<script src="../js/browse.js"></script>
</body>
</html>
